[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fungifind"
version = "0.1.0"
description = "A rule-based Swedish chanterelle suitability index prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FungiFind" }]
dependencies = []

[project.optional-dependencies]
raster = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
]
geo = [
    "geopandas>=0.14",
    "numpy>=1.26",
    "pandas>=2.1",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
    "xarray>=2024.1",
]
ml = ["scikit-learn>=1.4"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fungifind = "fungifind.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
